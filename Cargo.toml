[package]
name = "realm-guard-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared core (E2EE crypto + custom delta-state CRDT) for Realm Guard multi-device sync."
repository = "https://github.com/nexus-realm/realm-guard-core"
publish = false

[dependencies]
thiserror = "2"
argon2 = "0.5"
bip39 = "2"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
