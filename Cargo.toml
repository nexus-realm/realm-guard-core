[package]
name = "realm-guard-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared core (E2EE crypto + custom delta-state CRDT) for Realm Guard multi-device sync."
repository = "https://github.com/nexus-realm/realm-guard-core"
publish = false

[dependencies]
thiserror = "2"
argon2 = "0.5"
bip39 = { version = "2", features = ["zeroize"] }
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
opaque-ke = { version = "4", features = ["argon2"] }
postcard = { version = "1", features = ["use-std"] }
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
