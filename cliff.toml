# git-cliff — changelog + calcul de version (Conventional Commits). https://git-cliff.org
[changelog]
header = """
# Changelog

Toutes les modifications notables de ce projet sont documentées ici.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Non publié]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}** : {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Fonctionnalités" },
  { message = "^fix", group = "Corrections" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactorisation" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "Intégration continue" },
  { message = "^build", group = "Build" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "Divers" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
